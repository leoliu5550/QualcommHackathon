[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=fileorg
    --cov-report=html
    --cov-report=term-missing
    --cov-report=term:skip-covered
markers =
    unit: 單元測試
    integration: 整合測試
    slow: 執行時間較長的測試
    scanner: 檔案掃描器相關測試
    parser: 檔案解析器相關測試
    classifier: 分類器相關測試
    organizer: 組織器相關測試