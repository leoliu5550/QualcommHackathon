name: "Code Quality & Commit Lint"

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  quality-check:
    name: "Code Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      # Ruff Checks
      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      # Bandit Security Scan
      - name: Run Bandit Security Scan
        run: uv run bandit -r . -c pyproject.toml --exclude tests
        continue-on-error: false

      # pip-audit Security Audit
      - name: Run pip-audit
        run: |
          # 使用 uv export 生成 requirements.txt
          uv export --no-hashes --no-dev -o requirements-audit.txt
          uv run pip-audit --local --ignore-vuln GHSA-4xh5-x5gv-qwph --ignore-vuln GHSA-f83h-ghpp-7wcc --skip-editable -r requirements-audit.txt
        continue-on-error: false

      - name: Cleanup temporary files
        if: always()
        run: rm -f requirements-audit.txt