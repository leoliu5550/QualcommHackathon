name: Documentation Generation

on:
  push:
    branches: [ main ]
    paths:
      - 'fileorg/**/*.py'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'fileorg/**/*.py'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints
          pip install myst-parser sphinx-copybutton
          pip install pydoc-markdown

      - name: Create docs directory structure
        run: |
          mkdir -p docs/source
          mkdir -p docs/api
          mkdir -p docs/_build

      - name: Generate Sphinx configuration
        run: |
          cat > docs/source/conf.py << 'EOF'
          import os
          import sys
          sys.path.insert(0, os.path.abspath('../..'))
          
          project = 'FileOrg'
          copyright = '2024, FileOrg Team'
          author = 'Leo, Yide, Joel, Steven'
          release = '1.0.0'
          
          extensions = [
              'sphinx.ext.autodoc',
              'sphinx.ext.napoleon',
              'sphinx.ext.viewcode',
              'sphinx.ext.intersphinx',
              'sphinx_autodoc_typehints',
              'sphinx_copybutton',
              'myst_parser',
          ]
          
          templates_path = ['_templates']
          exclude_patterns = []
          
          html_theme = 'sphinx_rtd_theme'
          html_static_path = ['_static']
          
          html_theme_options = {
              'navigation_depth': 4,
              'collapse_navigation': False,
              'sticky_navigation': True,
          }
          
          intersphinx_mapping = {
              'python': ('https://docs.python.org/3', None),
              'numpy': ('https://numpy.org/doc/stable/', None),
              'torch': ('https://pytorch.org/docs/stable/', None),
          }
          
          napoleon_google_docstring = True
          napoleon_numpy_docstring = True
          napoleon_include_init_with_doc = True
          
          myst_enable_extensions = [
              "colon_fence",
              "deflist",
          ]
          EOF

      - name: Generate index.rst
        run: |
          cat > docs/source/index.rst << 'EOF'
          FileOrg Documentation
          =====================
          
          .. toctree::
             :maxdepth: 2
             :caption: Contents:
          
             modules
          
          FileOrg - AI-powered file organization tool
          
          Features
          --------
          
          * AI-powered file categorization
          * Automatic folder organization  
          * Restore capability
          * Detailed reporting
          * Cross-platform support
          
          Quick Start
          -----------
          
          .. code-block:: bash
          
             pip install git+https://github.com/leoliu5550/QualcommHackathon.git
             
             fileorg preview /path/to/directory
             fileorg organize /path/to/directory
             fileorg restore /path/to/directory
          
          Indices and tables
          ==================
          
          * :ref:`genindex`
          * :ref:`modindex`
          * :ref:`search`
          EOF

      - name: Generate modules.rst
        run: |
          cat > docs/source/modules.rst << 'EOF'
          fileorg
          =======
          
          .. toctree::
             :maxdepth: 4
          
             fileorg
          EOF

      - name: Run sphinx-apidoc
        run: |
          sphinx-apidoc -f -o docs/source fileorg

      - name: Build Sphinx documentation
        run: |
          cd docs
          sphinx-build -b html source _build/html

      - name: Generate API documentation from docstrings
        run: |
          python -m pydoc -w fileorg
          mkdir -p docs/pydoc
          mv *.html docs/pydoc/ || true

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            docs/_build/
            docs/pydoc/

      - name: Prepare for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -r docs/_build/html/* _site/ 2>/dev/null || true
          cp -r docs/pydoc _site/pydoc/ 2>/dev/null || true
          
          if [ ! -f _site/index.html ]; then
            cat > _site/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
                <title>FileOrg Documentation</title>
                <meta charset="utf-8">
                <style>
                    body { font-family: Arial, sans-serif; margin: 40px; }
                    h1 { color: #333; }
                    .links { margin: 20px 0; }
                    .links a { margin: 0 10px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
                </style>
            </head>
            <body>
                <h1>FileOrg Documentation</h1>
                <p>AI-powered file organization tool</p>
                <div class="links">
                    <a href="index.html">Documentation</a>
                    <a href="pydoc/fileorg.html">API Reference</a>
                    <a href="https://github.com/leoliu5550/QualcommHackathon">GitHub</a>
                </div>
            </body>
            </html>
            EOF
          fi

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4