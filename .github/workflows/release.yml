# 修正過的 GitHub Actions 工作流程，發布到 GitHub Packages
name: Publish to GitHub Packages

on:
  push:
    branches: [ main, release* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # 發布到 GitHub Packages 需要這個權限

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 檢查程式碼
      - uses: actions/checkout@v4

      # 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 安裝建置工具
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      # 建立套件
      - name: Build package
        run: python -m build

      # 驗證套件
      - name: Verify package
        run: |
          ls -la dist/
          python -m zipfile -l dist/*.whl

      # 建立 GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}