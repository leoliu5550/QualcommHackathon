# 修正過的 GitHub Actions 工作流程，發布到 GitHub Packages
name: Publish to GitHub Packages

on:
  push:
    branches: [ main, release* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # 發布到 GitHub Packages 需要這個權限

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 檢查程式碼
      - uses: actions/checkout@v4

      # 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 安裝建置工具
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          # 安裝 build, wheel, setuptools 與 twine（確保 twine 可用）
          python -m pip install --upgrade build setuptools wheel twine

      - name: Verify tools installed (debug)
        run: |
          python -V
          python -m pip --version
          python -m pip show twine || true
          python -m pip list

      # 建立套件
      - name: Build package
        run: python -m build

      # 驗證套件
      - name: Verify package
        run: |
          ls -la dist/
          python -m zipfile -l dist/*.whl || true

      # ---- 新增：把 dist 上傳到 GitHub Packages (PyPI registry) ----
      - name: Publish to GitHub Packages (PyPI)
        # GITHUB_TOKEN 可用來上傳到與 workflow 相同 repo 的 package
        env:
          # 對 twine，TWINE_USERNAME/TWINE_PASSWORD 會被使用 (也可用 __token__ 作為 username)
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 對於 organization-owned repo 使用 org endpoint
          # 對於 user-owned repo，改成: https://api.github.com/users/${{ github.repository_owner }}/packages/pypi/upload
          python -m twine upload --repository-url "https://api.github.com/users/${{ github.repository_owner }}/packages/pypi/upload" dist/*
