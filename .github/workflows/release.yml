# 修正過的 GitHub Actions 工作流程，發布到 GitHub Packages
name: Publish to GitHub Packages

on:
  push:
    branches: [ main, release* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # 發布到 GitHub Packages 需要這個權限

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 檢查程式碼
      - uses: actions/checkout@v4

      # 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 安裝建置工具
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          # 安裝 build, wheel, setuptools 與 twine（確保 twine 可用）
          python -m pip install --upgrade build setuptools wheel twine

      - name: Verify tools installed (debug)
        run: |
          python -V
          python -m pip --version
          python -m pip show twine || true
          python -m pip list

      # 建立套件
      - name: Build package
        run: python -m build

      # 驗證套件
      - name: Verify package
        run: |
          ls -la dist/
          python -m zipfile -l dist/*.whl || true

      # 確定正確的上傳 URL（根據 repository 類型）
      - name: Determine upload URL
        id: upload-url
        run: |
          # 檢查是否為組織 repository
          REPO_TYPE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" | \
            jq -r '.owner.type')
          
          if [ "$REPO_TYPE" = "Organization" ]; then
            echo "upload_url=https://api.github.com/orgs/${{ github.repository_owner }}/packages/pypi/upload" >> $GITHUB_OUTPUT
            echo "Repository type: Organization"
          else
            echo "upload_url=https://api.github.com/users/${{ github.repository_owner }}/packages/pypi/upload" >> $GITHUB_OUTPUT
            echo "Repository type: User"
          fi

      # 發布到 GitHub Packages
      - name: Publish to GitHub Packages (PyPI)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using upload URL: ${{ steps.upload-url.outputs.upload_url }}"
          python -m twine upload --verbose --repository-url "${{ steps.upload-url.outputs.upload_url }}" dist/*

      # 如果上傳失敗，提供更多除錯資訊
      - name: Debug on failure
        if: failure()
        run: |
          echo "Upload failed. Checking package details..."
          ls -la dist/
          python -m twine check dist/* || true
          echo "Repository info:"
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" | jq '{name, owner: .owner.login, type: .owner.type}'