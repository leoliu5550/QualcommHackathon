name: CI Pipeline

on:
  push:
    branches: [ main, release* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, release* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 允許此 workflow 使用 GITHUB_TOKEN 觸發其他 workflow
permissions:
  contents: read
  actions: write
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting and formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Auto-fix with Ruff and format with Black
        run: |
          ruff check --fix fileorg tests
          black fileorg tests

      - name: Run final lint check
        run: ruff check fileorg tests --output-format=github

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fileorg tests
          git diff --quiet && echo "No changes to commit" || (git commit -m "Auto-fix and format code with Ruff and Black" && git push)
  
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Run tests
        run: |
          pytest tests/unit/ -v --tb=short
          
  trigger_cleanup:
    name: Trigger Cleanup Workflow
    runs-on: ubuntu-latest
    # 等候 lint 與所有 test matrix job 成功
    needs: [lint, test]
    # 明確只在 job 成功時才執行（預設 needs 就會，只是更顯式）
    if: always() 
    steps:
      - name: Trigger Cleanup Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          # 這裡要填寫 workflow 的檔名（在 .github/workflows/ 下）
          workflow: 'cleanup_branches.yml'
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
