[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileorg"
version = "1.0.0"
description = "智慧檔案整理工具 - 使用 AI 技術自動分類與整理檔案"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Leo", email = "leoliu5550@gmail.com"},
    {name = "Yide", email = "lin.yide.doris@gmail.com"},
    {name = "Joel", email = "jieyao.hsu.efef31016@gmail.com"},
    {name = "Steven", email = "bingjunye4@gmail.com"}
]
maintainers = [
    {name = "Leo", email = "leoliu5550@gmail.com"},
    {name = "Yide", email = "lin.yide.doris@gmail.com"},
    {name = "Joel", email = "jieyao.hsu.efef31016@gmail.com"},
    {name = "Steven", email = "bingjunye4@gmail.com"}
]
keywords = ["file organization", "AI", "automation", "document management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core document processing (required for all modes)
    "python-docx>=0.8.11",
    "openpyxl>=3.0.0",
    "python-pptx>=0.6.21",
    "pypdf>=3.0.0",  # Modern replacement for PyPDF2
    "tqdm>=4.65.0",
    "charset-normalizer>=3.0.0",
    "httpx"
]

[project.optional-dependencies]
# Non-NPU mode: Heavy dependencies for running models on CPU/GPU
non-npu = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "sentencepiece>=0.1.99",  # Required for some tokenizers
    "protobuf>=3.20.0",  # Required for some models
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0", 
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",  # Modern linter replacing flake8
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

# Documentation tools
docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.3",
    "mkdocstrings[python]==0.24.0",
    "mkdocs-git-revision-date-localized-plugin==1.2.2",
    "mkdocs-minify-plugin==0.7.2",
    "pymdown-extensions==10.5",
    "sphinx>=5.0.0",
    "furo>=2023.3.27",
    "myst-parser>=0.18.0",
]

# Complete development environment
all = [
    # Non-NPU mode dependencies
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    # Dev tools
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/leoliu5550/QualcommHackathon"
Documentation = "https://github.com/leoliu5550/QualcommHackathon/blob/main/README.md"
Repository = "https://github.com/leoliu5550/QualcommHackathon.git"
Issues = "https://github.com/leoliu5550/QualcommHackathon/issues"

[project.scripts]
fileorg = "fileorg.cli:main"

[tool.setuptools.packages.find]
include = ["fileorg*"] 

[tool.setuptools.package-data]
fileorg = ["**/*.json", "**/*.yaml", "**/*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=fileorg",
    "--cov-report=html",
    "--cov-report=term-missing",
]
markers = [
    "unit: 單元測試",
    "integration: 整合測試",
    "slow: 執行時間較長的測試",
    "parser: 檔案解析器測試",
    "scanner: 檔案掃描器測試",
    "organizer: 檔案組織器測試",
    "classifier: 檔案分類器測試",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["fileorg"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]