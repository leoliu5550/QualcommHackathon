[project]
name = "fileorg"
version = "1.0.0"
description = "智慧檔案整理工具 - 使用 AI 技術自動分類與整理檔案"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GNU GENERAL PUBLIC LICENSE" }
authors = [
    { name = "Leo", email = "leoliu5550@gmail.com" },
    { name = "Yide", email = "lin.yide.doris@gmail.com" },
    { name = "Joel", email = "jieyao.hsu.efef31016@gmail.com" },
    { name = "Steven", email = "bingjunye4@gmail.com" },
]
maintainers = [
    { name = "Leo", email = "leoliu5550@gmail.com" },
    { name = "Yide", email = "lin.yide.doris@gmail.com" },
    { name = "Joel", email = "jieyao.hsu.efef31016@gmail.com" },
    { name = "Steven", email = "bingjunye4@gmail.com" },
]
keywords = ["file organization", "AI", "automation", "document management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
    # "Operating System :: POSIX :: Linux",
    # "Operating System :: Microsoft :: Windows"
]

dependencies = [
    "appdirs>=1.4.4",
    # Core document processing (required for all modes)
    # "python-docx>=0.8.11",
    # "openpyxl>=3.0.0",
    # "python-pptx>=0.6.21",
    # "pypdf>=3.0.0", # Modern replacement for PyPDF2
    # "tqdm>=4.65.0",
    # "charset-normalizer>=3.0.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.2",
    "chardet>=5.2.0",
    "dotenv>=0.9.9",
    "jinja2>=3.1.0",
    "loguru>=0.7.3",
    "mammoth>=1.11.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.8",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pdfminer-six>=20251107",
    # ONNX Runtime for lightweight LLM inference
    "onnxruntime-gpu>=1.16.0",
    "tokenizers>=0.15.0",
]

[project.optional-dependencies]
# Development tools
dev = [
    # "pytest>=7.0.0",
    # "pytest-cov>=4.0.0",
    # "pytest-mock>=3.10.0",
    # "pytest-asyncio>=0.21.0",
    # "mypy>=1.0.0",
    # "build>=0.10.0",
    # "twine>=4.0.0",
    "pre-commit>=3.0.0",
    "commitizen>=4.9.1",
    "ruff>=0.1.0",       # Modern linter replacing flake8
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "ipykernel>=7.0.1",
    "loguru>=0.7.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

docs = [
    # "mkdocs>=1.5.3",
    # "mkdocs-material>=9.5.3",
    # "mkdocstrings[python]>=0.24.0",
    # "mkdocs-autorefs>=1.0.0",  # Updated to latest stable version
    # "mkdocs-git-revision-date-localized-plugin>=1.2.2",
    # "mkdocs-minify-plugin>=0.7.2",
    # "pymdown-extensions>=10.5",
]
# LLM Export: Dependencies for exporting models to ONNX (development only)
# Note: Models are exported in FP16 (preserving original precision), no additional quantization needed
llm-export = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "optimum[onnxruntime]>=1.16.0",
    "accelerate>=0.24.0",
    "sentencepiece>=0.1.99",  # Required for some tokenizers
    "protobuf>=3.20.0",  # Required for some models
]

# Non-NPU mode: Heavy dependencies for running models on CPU/GPU (backward compatibility)
non-npu = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "numpy>=1.24.0",
    "sentencepiece>=0.1.99", # Required for some tokenizers
    "protobuf>=3.20.0",      # Required for some models
]

[project.urls]
Homepage = "https://github.com/leoliu5550/QualcommHackathon"
Documentation = "https://github.com/leoliu5550/QualcommHackathon/blob/main/README.md"
Repository = "https://github.com/leoliu5550/QualcommHackathon.git"
Issues = "https://github.com/leoliu5550/QualcommHackathon/issues"

[project.scripts]
fileorg = "fileorg.main:main"
fileorg-export-llm = "fileorg.llm_classifier.infrastructure.export_model:main"
fileorg-download-model = "scripts.download_onnx_model:main"

[tool.setuptools.packages.find]
include = ["fileorg*", "scripts*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
fileorg = ["**/*.json", "**/*.yaml", "**/*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=fileorg",
    "--cov-report=html",
    "--cov-report=term-missing",
    "-m",
    "not gpu and not slow",      # Exclude GPU and slow tests by default
]
markers = [
    "unit: 單元測試",
    "integration: 整合測試",
    "slow: 執行時間較長的測試 (預設排除)",
    "gpu: 需要 GPU 的測試 (預設排除，僅供手動測試)",
    "parser: 檔案解析器測試",
    "scanner: 檔案掃描器測試",
    "organizer: 檔案組織器測試",
    "classifier: 檔案分類器測試",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "docs"]
targets = ["."]
skips = ["B101"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"

[tool.ruff]
line-length = 150
# 啟用更多 Linter 規則集，大幅提升嚴格度
lint.select = [
    "E",   # Pycodestyle Errors/Warnings (風格/錯誤)
    "F",   # Pyflakes (未使用的變數/未定義名稱)
    "I",   # isort (匯入排序)
    "W",   # Pycodestyle Warnings (潛在問題)
    "C4",  # flake8-comprehensions (列表/字典生成式簡潔性)
    "B",   # flake8-bugbear (可能的 Bug 或設計問題)
    "TID", # flake8-tidy-imports (規範匯入來源)
    "A",   # flake8-builtins (避免覆蓋內建函數)
]
# extend-exclude = ["tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["fileorg"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
