# .pre-commit-config.yaml

repos:
  # 將所有 Hook 都定義在 local repo 區塊下
  - repo: local
    hooks:

      # --- 1. Ruff Lint Check (使用 uv 環境中的版本) ---
      - id: ruff-check
        name: Ruff Lint Check
        entry: ruff check
        language: system
        types: [python]

      # --- 2. Ruff Format (使用 uv 環境中的版本) ---
      - id: ruff-format
        name: Ruff Code Format
        entry: ruff format --in-place
        language: system
        types: [python]

      # --- 3. Bandit Security Scan (使用 uv 環境中的版本) ---
      - id: bandit
        name: Bandit Security Scan
        entry: uv run bandit
        language: system
        types: [python]
        args: ["-r", ".", "-c", "pyproject.toml", "--exclude", "tests"]

      # --- 4. Pip-audit (使用 uv 環境中的版本) ---
      - id: pip-audit
        name: Pip Dependency Audit
        entry: bash -c
        language: system
        pass_filenames: false
        always_run: true
        args:
          - -c
          - |
            set -e
            echo "🔍 Running pip-audit on uv environment..."
            uv run pip-audit \
              --local \
              --ignore-vuln GHSA-4xh5-x5gv-qwph \
              --skip-editable


      # --- 5. Commitizen 提交訊息驗證 Hook ---
      - id: commitizen-check
        name: Commit Message Validation
        entry: cz check --message-format commit-msg
        language: system
        stages: [commit-msg]
