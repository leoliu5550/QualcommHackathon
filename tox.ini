# Tox configuration for multi-environment testing
# https://tox.wiki/

[tox]
envlist = 
    py{38,39,310,311}
    lint
    type
    docs
    coverage-report
minversion = 4.0
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run unit tests with pytest
deps =
    pytest>=7.0
    pytest-cov>=4.0
    pytest-mock>=3.10
    pytest-asyncio>=0.21
    pytest-timeout>=2.1
extras = dev
passenv = 
    HOME
    USERPROFILE
    CI
    GITHUB_*
setenv =
    TESTING = true
    PYTHONPATH = {toxinidir}
    COVERAGE_FILE = .coverage.{envname}
commands =
    pytest {posargs:tests/unit} \
        --cov=fileorg \
        --cov-report=term-missing:skip-covered \
        --cov-report=html \
        --cov-report=xml \
        -v \
        --tb=short

[testenv:py38]
description = Python 3.8 tests
basepython = python3.8

[testenv:py39]
description = Python 3.9 tests
basepython = python3.9

[testenv:py310]
description = Python 3.10 tests
basepython = python3.10

[testenv:py311]
description = Python 3.11 tests
basepython = python3.11

[testenv:lint]
description = Run linting with ruff and black
skip_install = True
deps =
    ruff>=0.1.0
    black>=23.0.0
commands =
    ruff check fileorg tests --fix
    black --check --diff fileorg tests

[testenv:format]
description = Format code with black
skip_install = True
deps =
    black>=23.0.0
commands =
    black fileorg tests

[testenv:type]
description = Run type checking with mypy
deps =
    mypy>=1.0.0
    types-requests
    types-PyYAML
commands =
    mypy fileorg --ignore-missing-imports --no-error-summary

[testenv:security]
description = Run security checks with bandit
skip_install = True
deps =
    bandit[toml]>=1.7.0
commands =
    bandit -r fileorg -ll -i

[testenv:docs]
description = Build documentation with Sphinx
changedir = docs
deps =
    sphinx>=5.0
    sphinx-rtd-theme
    sphinx-autodoc-typehints
    myst-parser
    sphinx-copybutton
commands =
    sphinx-build -W -b html source _build/html

[testenv:coverage-report]
description = Combine coverage data and generate reports
skip_install = True
deps =
    coverage[toml]>=7.0
setenv =
    COVERAGE_FILE = .coverage
commands =
    coverage combine
    coverage report --skip-covered --show-missing
    coverage html
    coverage xml
    coverage json

[testenv:integration]
description = Run integration tests
passenv = {[testenv]passenv}
setenv = 
    {[testenv]setenv}
    INTEGRATION_TESTS = true
commands =
    pytest {posargs:tests/integration} \
        -v \
        --tb=short \
        -m "not slow"

[testenv:full]
description = Run all tests including slow ones
passenv = {[testenv]passenv}
setenv = {[testenv]setenv}
commands =
    pytest {posargs:tests} \
        --cov=fileorg \
        --cov-report=term-missing \
        --cov-report=html \
        -v

[testenv:clean]
description = Clean up temporary files
skip_install = True
deps =
allowlist_externals = 
    rm
    find
    cmd
commands =
    - rm -rf .coverage* htmlcov coverage.xml coverage.json .pytest_cache .mypy_cache .ruff_cache
    - find . -type d -name __pycache__ -exec rm -rf {} +
    - find . -type f -name "*.pyc" -delete
    - find . -type f -name "*.pyo" -delete
    - find . -type f -name "*~" -delete

[testenv:build]
description = Build distribution packages
skip_install = True
deps =
    build>=0.10
    twine>=4.0
commands =
    python -m build
    twine check --strict dist/*

[testenv:release-test]
description = Test release to TestPyPI
skip_install = True
deps =
    build>=0.10
    twine>=4.0
passenv = 
    TEST_PYPI_TOKEN
setenv =
    TWINE_USERNAME = __token__
    TWINE_PASSWORD = {env:TEST_PYPI_TOKEN}
commands =
    python -m build
    twine upload --repository testpypi dist/*

[gh-actions]
# Map GitHub Actions Python versions to tox environments
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311, lint, type, docs

[pytest]
# pytest configuration (also in pyproject.toml, kept for compatibility)
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=fileorg
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    requires_gpu: Tests requiring GPU
    requires_model: Tests requiring AI model